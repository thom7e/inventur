{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block page_header %}
<div class="main-header">
    <div>
        <h1 class="main-title">Anmeldung</h1>
        <p class="text-muted mb-0">Bitte melden Sie sich mit Ihrem Administrationskonto an.</p>
    </div>
</div>
{% endblock %}

{% block content %}
<section class="section-card" style="max-width: 480px;">
    <form method="post" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Benutzername</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-custom btn-block">Anmelden</button>
    </form>
</section>
{% endblock %}
