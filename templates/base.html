<!doctype html>
<html lang="de">
<head>
    <script>document.documentElement.classList.add('js-enabled');</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Inventur{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>

<a href="#main-content" class="skip-link">Zum Inhalt springen</a>

<nav class="navbar navbar-expand-lg navbar-light" role="navigation" aria-label="Hauptnavigation">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="Inventur – Startseite" class="logo">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation ein-/ausklappen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                       href="{{ url_for('index') }}"
                       {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Inventur</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin' %}active{% endif %}"
                       href="{{ url_for('admin' if session.get('is_admin') else 'login') }}"
                       {% if request.endpoint == 'admin' %}aria-current="page"{% endif %}>Verwaltung</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'uebersicht_inventur' %}active{% endif %}"
                       href="{{ url_for('uebersicht_inventur') }}"
                       {% if request.endpoint == 'uebersicht_inventur' %}aria-current="page"{% endif %}>Übersicht</a>
                </li>
                {% if session.get('is_admin') %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Abmelden</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<main id="main-content" class="container">
    {% block page_header %}{% endblock %}
    {% block content %}{% endblock %}
</main>

<div id="app-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <span class="toast-message"></span>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script>
    // CSRF-Token automatisch zu allen fetch()-POST-Anfragen hinzufügen
    (function () {
        var csrfMeta = document.querySelector('meta[name="csrf-token"]');
        var csrfToken = csrfMeta ? csrfMeta.getAttribute('content') : '';
        if (!csrfToken) return;
        var _origFetch = window.fetch;
        window.fetch = function (url, opts) {
            opts = opts || {};
            var method = (opts.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) !== -1) {
                if (opts.headers instanceof Headers) {
                    opts.headers.set('X-CSRF-Token', csrfToken);
                } else {
                    opts.headers = Object.assign({}, opts.headers || {}, {'X-CSRF-Token': csrfToken});
                }
            }
            return _origFetch.call(this, url, opts);
        };
    })();

    // Button Loading-State Helfer
    window.setButtonLoading = function (btn, loading) {
        if (!btn) return;
        if (loading) {
            btn.classList.add('btn-loading');
            btn.disabled = true;
        } else {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
        }
    };

    window.showToast = function(message, variant) {
        var toast = document.getElementById('app-toast');
        if (!toast) return;
        toast.classList.remove('toast-success', 'toast-error');
        toast.classList.add(variant === 'error' ? 'toast-error' : 'toast-success');
        toast.querySelector('.toast-message').textContent = message;
        toast.classList.add('show');
        clearTimeout(window.__toastTimer);
        // Fehler 5s, Erfolg 3.5s sichtbar
        window.__toastTimer = setTimeout(function () {
            toast.classList.remove('show');
        }, variant === 'error' ? 5000 : 3500);
    };

    window.handleJsonResponse = async function(response) {
        if (response.ok) {
            return response.json();
        }
        const data = await response.json().catch(function () { return { success: false }; });
        const message = (data && data.message) ? data.message : 'Aktion fehlgeschlagen.';
        window.showToast(message, 'error');
        throw new Error(message);
    };
</script>
{% block scripts %}{% endblock %}
</body>
</html>
