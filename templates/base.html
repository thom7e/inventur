<!doctype html>
<html lang="de">
<head>
    <script>document.documentElement.classList.add('js-enabled');</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventur{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="Logo" class="logo">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation ein-/ausklappen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Inventur</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint in ('login', 'admin') %}active{% endif %}" href="{{ url_for('admin' if session.get('is_admin') else 'login') }}">Verwaltung Inventur</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'uebersicht_inventur' %}active{% endif %}" href="{{ url_for('uebersicht_inventur') }}">Uebersicht Inventur</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block page_header %}{% endblock %}
    {% block content %}{% endblock %}
</div>

<div id="app-toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-message"></span>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script>
    window.showToast = function(message, variant) {
        var toast = document.getElementById('app-toast');
        if (!toast) {
            return;
        }
        toast.classList.remove('toast-success', 'toast-error');
        toast.classList.add(variant === 'error' ? 'toast-error' : 'toast-success');
        toast.querySelector('.toast-message').textContent = message;
        toast.classList.add('show');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(function () {
            toast.classList.remove('show');
        }, 3500);
    };

    window.handleJsonResponse = async function(response) {
        if (response.ok) {
            return response.json();
        }
        const data = await response.json().catch(function () { return { success: false }; });
        const message = (data && data.message) ? data.message : 'Aktion fehlgeschlagen.';
        window.showToast(message, 'error');
        throw new Error(message);
    };
</script>
{% block scripts %}{% endblock %}
</body>
</html>
